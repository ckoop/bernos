name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (Sonos-Kern und Uhr-Protokoll)
        run: ./gradlew :sonos-core:test :wear-protocol:test

      - name: Android-App bauen und Oberflaeche testen
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      - name: Wear-OS-App bauen und Oberflaeche testen
        run: ./gradlew :wear:assembleDebug :wear:testDebugUnitTest

      - name: Lint (Handy und Uhr)
        run: ./gradlew :app:lintDebug :wear:lintDebug

      - name: Testberichte bereitstellen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: bernos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Uhr-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: bernos-wear-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
